async function deriveKey(pw) {
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
    mat, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function unlockWith(key) {

  document.open();
  document.write(new TextDecoder().decode(plain));
  document.close();
}
async function go() {
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Unlocking\u2026'; err.textContent = '';
  try {
    const key = await deriveKey(document.getElementById('pw').value);
    if (document.getElementById('remember').checked) {
      try {
        const raw = await crypto.subtle.exportKey('raw', key);
        localStorage.setItem('oryxlogkey', btoa(String.fromCharCode(...new Uint8Array(raw))));
      } catch (e) {}
    }
    await unlockWith(key);
  } catch (e) {
    err.textContent = 'Wrong passphrase.';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}
document.getElementById('go').addEventListener('click', go);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
(async () => {
  try {
    const saved = localStorage.getItem('oryxlogkey');
    if (!saved) return;
    const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']);
    await unlockWith(key);
  } catch (e) { try { localStorage.removeItem('oryxlogkey'); } catch (_) {} }
})();
</script>
